# Publicação web no Netlify (o deploy normal é feito pelo GitHub Actions: .github/workflows/deploy-web.yml).
# Também funciona ligando o repositório direto no Netlify: defina EXPO_PUBLIC_API_URL nas variáveis do site.
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fallback de SPA (o mesmo do public/_redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
